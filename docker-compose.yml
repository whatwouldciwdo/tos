services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tor-online-app
    restart: always
    ports:
      - "3120:3120"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3120


  ws:
    build:
      context: .
      dockerfile: Dockerfile.ws
    container_name: tor-online-ws
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT_WS=3001
      - HOST=0.0.0.0
